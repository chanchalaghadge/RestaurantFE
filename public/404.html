<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening Restaurant App…</title>
    <script>
      (function () {
        var isProjectSite = location.hostname.endsWith(".github.io");
        var repository = location.pathname.split("/")[1];
        var basePath = isProjectSite && repository ? "/" + repository + "/" : "/";
        sessionStorage.setItem("spa-redirect", location.pathname + location.search + location.hash);
        location.replace(location.origin + basePath);
      })();
    </script>
  </head>
  <body></body>
</html>
